name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm test

  differential:
    name: Differential (test-vectors vs vN-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            chains:
              - 'src/chains/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.chains }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Run differential harness
        if: steps.should-run.outputs.run == 'true'
        run: pnpm --filter @wraith-protocol/test-vectors differential

  slow-tests:
    name: Property fuzz (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz

  heap-regression:
    name: Heap constructor regression (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run constructor-level heap regression harness
        run: pnpm test:heap-leak
      - name: Upload heap regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heap-regression-${{ github.run_id }}
          path: |
            heap-diff.json
            heap-before.heapsnapshot
            heap-after.heapsnapshot
          if-no-files-found: warn
          retention-days: 14
