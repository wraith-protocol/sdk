name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm build
      - run: pnpm api:check
      - run: pnpm test

  entrypoints:
    name: Package entry point smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:exports

  differential:
    name: Differential (test-vectors vs vN-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            chains:
              - 'src/chains/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.chains }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Run differential harness
        if: steps.should-run.outputs.run == 'true'
        run: pnpm --filter @wraith-protocol/test-vectors differential

  bundle-size:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            src:
              - 'src/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.src }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Check bundle sizes
        if: steps.should-run.outputs.run == 'true'
        run: pnpm size

  slow-tests:
    name: Property fuzz (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz

  heap-regression:
    name: Heap constructor regression (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run constructor-level heap regression harness
        run: pnpm test:heap-leak
      - name: Upload heap regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heap-regression-${{ github.run_id }}
          path: |
            heap-diff.json
            heap-before.heapsnapshot
            heap-after.heapsnapshot
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Pack + release alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # What `pnpm publish` would ship: only dist/ plus the files npm always
      # includes. Catches a stray `files` edit at PR time rather than release time.
      - name: Verify the packed file list
        run: pnpm pack:check
      # Changelog entry and API report alignment for the current version.
      - name: Check release alignment
        run: pnpm release:check

  entrypoints:
    name: Package entry point smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:exports

  compat:
    name: Compatibility matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # A runtime that cannot install the SDK should not mask one that can.
      fail-fast: false
      matrix:
        include:
          - name: Node 20
            node-version: 20
            command: pnpm test:compat
          - name: Node 22
            node-version: 22
            command: pnpm test:compat
          - name: Node 24
            node-version: 24
            command: pnpm test:compat
          - name: Bun 1.x
            node-version: 22
            bun: true
            # The runtime checks import the built package under Bun, which is
            # the part of the matrix that is runtime-specific. The bundle and
            # tarball checks are runtime-independent and run on Node above.
            command: bun scripts/compat/verify-imports.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with:
          bun-version: 1.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ${{ matrix.command }}

  differential:
    name: Differential (test-vectors vs vN-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            chains:
              - 'src/chains/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.chains }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Run differential harness
        if: steps.should-run.outputs.run == 'true'
        run: pnpm --filter @wraith-protocol/test-vectors differential

  bundle-size:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            src:
              - 'src/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.src }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Check bundle sizes
        if: steps.should-run.outputs.run == 'true'
        run: pnpm size

  slow-tests:
    name: Property fuzz (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz

  heap-regression:
    name: Heap constructor regression (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run constructor-level heap regression harness
        run: pnpm test:heap-leak
      - name: Upload heap regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heap-regression-${{ github.run_id }}
          path: |
            heap-diff.json
            heap-before.heapsnapshot
            heap-after.heapsnapshot
          if-no-files-found: warn
          retention-days: 14
