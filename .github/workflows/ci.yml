name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm build
      - run: pnpm api:check
      # Compile-time checks for the public types. Runs plain `tsc` on purpose:
      # `vitest --typecheck` silently reports zero errors for type errors inside
      # test() bodies in this repo, so it cannot be trusted as a gate.
      - run: pnpm test:types
      - run: pnpm test
      # Run a small fixed-seed sample of Stellar property tests on every PR
      - name: Stellar property test sample
        if: github.event_name == 'pull_request'
        run: pnpm test:fuzz:sample

  security-audit:
    name: Security audit (fail on unapproved critical advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:ci

  entrypoints:
    name: Package entry point smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:exports
      # `pnpm pack --dry-run` over the same dist/: the tarball has to list only
      # the files `package.json`'s `files` field intends.
      - name: Verify only intended files would be published
        run: pnpm pack:check

  packages:
    name: Companion package tarball smoke tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Packs each companion workspace package (`sdk-agent`, `sdk-react`,
      # `sdk-vue`, `sdk-solid`, `sdk-svelte`, `codemod`, `test-vectors`) and
      # smoke-tests it as an independently publishable tarball: ESM, types,
      # documented exports, published file list, and that no workspace-only
      # import fails to resolve from npm in a clean fixture.
      - run: pnpm test:packages

  framework-types:
    name: Framework package types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # These packages are published separately and their tests run under the
      # root suite, but nothing type-checked them before, which let framework
      # hooks drift away from the SDK's typed exports.
      - run: pnpm --filter @wraith-protocol/sdk-react test:types
      - run: pnpm --filter @wraith-protocol/sdk-vue test:types
      - run: pnpm --filter @wraith-protocol/sdk-solid test:types
      - run: pnpm --filter @wraith-protocol/sdk-svelte typecheck

  compat:
    name: Compatibility matrix (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # A runtime that cannot install the SDK should not mask one that can.
      fail-fast: false
      matrix:
        include:
          - name: Node 20
            node-version: 20
            command: pnpm test:compat
          - name: Node 22
            node-version: 22
            command: pnpm test:compat
          - name: Node 24
            node-version: 24
            command: pnpm test:compat
          - name: Bun 1.x
            node-version: 22
            bun: true
            # The runtime checks import the built package under Bun, which is
            # the part of the matrix that is runtime-specific. The bundle and
            # tarball checks are runtime-independent and run on Node above.
            command: bun scripts/compat/verify-imports.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: oven-sh/setup-bun@v2
        if: matrix.bun
        with:
          bun-version: 1.x
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: ${{ matrix.command }}

  differential:
    name: Differential (test-vectors vs vN-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            chains:
              - 'src/chains/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.chains }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Run differential harness
        if: steps.should-run.outputs.run == 'true'
        run: pnpm --filter @wraith-protocol/test-vectors differential

  bundle-size:
    name: Bundle size (size-limit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            src:
              - 'src/**'

      - name: Determine whether to run
        id: should-run
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ steps.filter.outputs.src }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.should-run.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.should-run.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        if: steps.should-run.outputs.run == 'true'
        run: pnpm build

      - name: Check bundle sizes
        if: steps.should-run.outputs.run == 'true'
        run: pnpm size

  slow-tests:
    name: Property fuzz (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fuzz

  heap-regression:
    name: Heap constructor regression (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run constructor-level heap regression harness
        run: pnpm test:heap-leak
      - name: Upload heap diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heap-regression-${{ github.run_id }}
          path: heap-diff.json
          if-no-files-found: warn
          retention-days: 14

  stream-leak-regression:
    name: Streaming scan leak regression (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run streaming scan leak harness
        run: pnpm test:leak
      - name: Upload stream leak diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stream-leak-regression-${{ github.run_id }}
          path: scan-leak-diagnostics.json
          if-no-files-found: warn
          retention-days: 14

  leak-injection:
    name: Leak detection gate (nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prove the streaming leak gate catches a deliberate leak
        id: stream-gate
        continue-on-error: true
        run: SCAN_LEAK_INJECT=1 pnpm test:leak
      - name: Prove the constructor leak gate catches a deliberate leak
        id: heap-gate
        continue-on-error: true
        run: HEAP_LEAK_INJECT=1 pnpm test:heap-leak
      - name: Fail when an injected leak goes undetected
        if: steps.stream-gate.outcome == 'success' || steps.heap-gate.outcome == 'success'
        run: |
          echo "An injected leak was not detected by its regression gate."
          echo "stream-gate outcome: ${{ steps.stream-gate.outcome }}"
          echo "heap-gate outcome: ${{ steps.heap-gate.outcome }}"
          exit 1
